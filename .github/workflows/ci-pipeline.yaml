name: Java-ci/cd
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: complete
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Setup java-version
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Build
        run: mvn clean package

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ vars.PROJECT_NAME }} \
            -Dsonar.organization=${{ vars.ORG_NAME }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.branch.name=dev \
            -Dsonar.token=${SONAR_TOKEN}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-build-artifacts
          path: complete/target/*.jar
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-build-artifacts
          path: target

      - name: Check downloaded files    # ← Add this to debug
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          find . -name "*.jar"

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app"
          port: 22
          timeout: 60s
          command_timeout: 10m

      - name: Run JAR on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Stop existing app if running
            pkill -f "serving-web-content" || true
            sleep 2

            # Check what was copied
            echo "Files in /home/ubuntu/app:"
            find /home/ubuntu/app -name "*.jar"

            # Run JAR dynamically
            JAR_FILE=$(find /home/ubuntu/app -name "*.jar" | head -1)
            echo "Starting $JAR_FILE ..."
            nohup java -jar $JAR_FILE > /home/ubuntu/app/app.log 2>&1 &

            sleep 3
            ps aux | grep java | grep -v grep
            echo "App started successfully!"